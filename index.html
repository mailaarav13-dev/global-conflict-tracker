<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e8edf2">
    <meta
      name="description"
      content="An interactive global affairs dashboard combining conflict profiles with frequently refreshed world news."
    >
    <title>Global Affairs Tracker</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="data/bootstrap-data.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#world-map">Skip to the map</a>

    <main class="app-shell">
      <header class="map-header">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
          </span>
          <div>
            <h1>Global Affairs Tracker</h1>
            <p id="data-status" aria-live="polite">Loading map data</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="briefing-toggle" class="briefing-toggle" type="button" aria-controls="briefing-panel" aria-expanded="false">World News</button>
          <a class="methodology-link" href="methodology.html">Methodology</a>
          <div class="scope-key" aria-label="Tracked situation scopes">
            <span><i class="scope-dot internal"></i>Internal</span>
            <span><i class="scope-dot international"></i>International</span>
            <span><i class="scope-dot transnational"></i>Transnational</span>
          </div>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
            <span class="theme-icon" aria-hidden="true">◐</span>
            <span id="theme-label">Dark mode</span>
          </button>
        </div>
      </header>

      <section class="map-stage" aria-label="Interactive conflict map">
        <div id="map-loading" class="map-loading" role="status">
          <span class="loading-line"></span>
          <span>Drawing the world map</span>
        </div>

        <svg
          id="world-map"
          viewBox="0 0 1000 520"
          role="group"
          aria-label="World map. Select a highlighted country to view its tracked situations."
        >
          <rect class="ocean" width="1000" height="520" rx="18"></rect>
          <g id="country-layer"></g>
        </svg>

        <div class="map-footer">
          <div class="severity-key" aria-label="Status legend">
            <span><i class="severity-swatch deteriorating"></i>Deteriorating</span>
            <span><i class="severity-swatch constant"></i>Constant</span>
            <span><i class="severity-swatch improving"></i>Improving</span>
            <span><i class="severity-swatch untracked"></i>Not tracked</span>
          </div>
          <p>Use + to zoom, then drag or scroll to move</p>
        </div>

        <div class="map-controls" aria-label="Map zoom controls">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <button id="reset-map" type="button" aria-label="Reset map">Reset</button>
        </div>

        <p id="map-message" class="map-message" role="status" hidden></p>
      </section>

      <div id="panel-backdrop" class="panel-backdrop" aria-hidden="true" hidden></div>
      <aside id="country-panel" class="country-panel" aria-labelledby="country-title" hidden>
        <div class="panel-topbar">
          <p>Country profile</p>
          <div class="panel-actions">
            <button id="panel-theme-toggle" class="panel-theme-button" type="button" aria-label="Switch color theme" aria-pressed="false">◐</button>
            <button id="close-panel" class="close-button" type="button" aria-label="Close country profile">×</button>
          </div>
        </div>
        <div id="panel-content" class="panel-content"></div>
      </aside>
      <aside id="briefing-panel" class="briefing-panel" aria-labelledby="briefing-title" hidden>
        <div class="panel-topbar">
          <p>World briefing</p>
          <button id="close-briefing" class="close-button" type="button" aria-label="Close world briefing">×</button>
        </div>
        <div id="briefing-content" class="briefing-content"></div>
      </aside>
    </main>

    <noscript>This tracker requires JavaScript to draw the interactive map.</noscript>
  </body>
</html>
